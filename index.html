<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AP CSA FRQ Auto-Grader</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #1f2937;
    }
    ::-webkit-scrollbar-thumb {
      background: #4b5563;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #6b7280;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- PRESET RUBRICS DATA ---
    const PRESET_RUBRICS = [
      {
        id: 'unit1-email-9pt',
        name: 'Unit 1 Progress Check: FRQ Part C (9 Points)',
        source: 'AP Classroom Progress Check',
        totalPoints: 9,
        description: 'Processes an email address (firstname.lastname@domain) to create 3 unique usernames utilizing String methods (indexOf, substring) and Math.random().',
        promptText: `Context:
An email address is stored in String variable email (e.g., "joseph.martin@school.org").
Email format: firstname.lastname@domain.
Assume last name has at least 3 characters.

Tasks:
1. Find index of first "." and "@" using indexOf and store in variables.
2. Extract first and last name using substring. Create String variable user1 = first + "_" + last.
3. Extract first initial of first name. Create String variable user2 = firstInit + "_" + last.
4. Use Math.random() to generate random int between 0 and first.length(). Generate another between 0 and last.length() - 2.
5. Create user3 = random char from first name + "_" + 3 consecutive chars from last name using the generated random numbers.`,
        criteria: [
          {
            id: 'A1',
            section: 'Part A',
            pointTitle: 'Part A Pt 1: Finds positions of "." and "@"',
            description: 'Finds the positions of the first period "." and the "@" using appropriate String method calls (e.g., email.indexOf(".") and email.indexOf("@")).',
            apRules: 'Do NOT earn point if any incorrect call to String method is made.'
          },
          {
            id: 'B1',
            section: 'Part B',
            pointTitle: 'Part B Pt 1: Extracts first and last names',
            description: 'Extracts the first and last names from the email address using email.substring(0, periodLoc) and email.substring(periodLoc + 1, atLoc).',
            apRules: 'Can earn point even if periodLoc or atLoc were incorrectly identified earlier. Missing or incorrect String method call forfeits point.'
          },
          {
            id: 'B2',
            section: 'Part B',
            pointTitle: 'Part B Pt 2: Creates user1 String variable',
            description: 'Creates a String variable containing first name and last name (e.g., user1 = first + "_" + last).',
            apRules: 'AP Rule: Responses CAN STILL EARN this point even if they omit the underscore ("_"). Forfeited if incorrect String method call made.'
          },
          {
            id: 'C1',
            section: 'Part C',
            pointTitle: 'Part C Pt 1: Extracts first initial',
            description: 'Extracts the first initial of the first name using email.substring(0, 1) or first.substring(0, 1).',
            apRules: 'Forfeited if incorrect String method call made.'
          },
          {
            id: 'C2',
            section: 'Part C',
            pointTitle: 'Part C Pt 2: Creates user2 String variable',
            description: 'Creates a String variable containing the first initial of the first name and the last name (e.g., user2 = firstInit + "_" + last).',
            apRules: 'AP Rule: Responses CAN STILL EARN this point even if they omit the underscore ("_"). Forfeited if incorrect String method call.'
          },
          {
            id: 'D1',
            section: 'Part D',
            pointTitle: 'Part D Pt 1: Random number for first name length',
            description: 'Uses Math.random() to generate a random integer between 0 and first.length() (e.g., (int)(Math.random() * first.length())).',
            apRules: 'Forfeited if any incorrect call to Math.random() or incorrect casting.'
          },
          {
            id: 'D2',
            section: 'Part D',
            pointTitle: 'Part D Pt 2: Random number for last name length - 2',
            description: 'Uses Math.random() to generate a random integer between 0 and last.length() - 2 (e.g., (int)(Math.random() * (last.length() - 2))).',
            apRules: 'Forfeited if any incorrect call to Math.random() or incorrect casting or formula.'
          },
          {
            id: 'E1',
            section: 'Part E',
            pointTitle: 'Part E Pt 1: Extracts random char & 3-char sequence',
            description: 'Extracts a randomly selected character from first name (first.substring(numFirst, numFirst + 1)) and 3 consecutive characters from last name (last.substring(numLast, numLast + 3)).',
            apRules: 'AP Rule: Responses can still earn point even if random number generation was incorrect. Forfeited for incorrect String method calls.'
          },
          {
            id: 'E2',
            section: 'Part E',
            pointTitle: 'Part E Pt 2: Creates user3 String variable',
            description: 'Creates a String variable containing the identified character from first name, underscore, and identified 3 characters from last name.',
            apRules: 'AP Rule: Responses CAN STILL EARN point even if they omit underscore OR incorrectly obtained characters in Part E1. Forfeited if incorrect String call.'
          }
        ],
        samplePerfect: `// --- 100% PERFECT STUDENT RESPONSE ---
int periodLoc = email.indexOf(".");
int atLoc = email.indexOf("@");

String first = email.substring(0, periodLoc);
String last = email.substring(periodLoc + 1, atLoc);
String user1 = first + "_" + last;

String firstInit = email.substring(0, 1);
String user2 = firstInit + "_" + last;

int lenFirst = first.length();
int numFirst = (int) (Math.random() * lenFirst);
int lenLast = last.length() - 2;
int numLast = (int) (Math.random() * lenLast);

String firstChar = first.substring(numFirst, numFirst + 1);
String lastChar3 = last.substring(numLast, numLast + 3);
String user3 = firstChar + "_" + lastChar3;`,
        sampleMistakes: `// --- COMMON MISTAKES RESPONSE (Expected 5-6/9) ---
// Error 1: Using single quote char indexOf instead of String (Minor, but indexOf('.') is valid in Java, though let's check indexOf)
int periodLoc = email.indexOf(".");
int atLoc = email.indexOf("@");

// Error 2: Hardcoded indices instead of using substring dynamically
String first = email.substring(0, 6); // Hardcoded off-by-one
String last = email.substring(periodLoc + 1, atLoc);
String user1 = first + last; // Omitted underscore (AP Rule: STILL EARNS B2!)

String firstInit = email.substring(1, 2); // Error: Wrong index (gets 2nd char instead of 1st)
String user2 = firstInit + "_" + last;

// Error 3: Forgot to subtract 2 for last name random bound
int numFirst = (int)(Math.random() * first.length());
int numLast = (int)(Math.random() * last.length()); // Missed "- 2"

// Error 4: Substring length off by one (takes 2 chars instead of 3)
String firstChar = first.substring(numFirst, numFirst + 1);
String lastChar3 = last.substring(numLast, numLast + 2); // Off-by-one char length
String user3 = firstChar + "_" + lastChar3;`
      },
      {
        id: 'unit1-car-6pt',
        name: 'Unit 1 Reassessment Question 2: Car & CarRunner (6 Points)',
        source: 'Teacher Custom Reassessment',
        totalPoints: 6,
        description: 'Implements addGas method in Car class and completes main runner logic in CarRunner class with object instantiation, method calls, and toString output.',
        promptText: `Car class provides gasLevel and color attributes with constructor, changeColor, and toString.

Instructions:
1. Complete addGas(double amount) method in Car class to add amount to gasLevel.
2. In CarRunner main method:
   - Create two Car objects with custom constructor arguments.
   - Print initial information for both cars using toString().
   - Add 12.5 gallons of gas to first car.
   - Change color of second car to "Silver".
   - Print final information for both cars.`,
        criteria: [
          {
            id: 'P1',
            section: 'Car Class',
            pointTitle: 'Point 1: gasLevel correctly updated in addGas()',
            description: 'gasLevel instance variable is correctly updated in addGas method (e.g., gasLevel += amount; or gasLevel = gasLevel + amount;).',
            apRules: 'Must accumulate gas, not overwrite gasLevel = amount.'
          },
          {
            id: 'P2',
            section: 'CarRunner',
            pointTitle: 'Point 2: Two Car objects correctly created',
            description: 'Creates two distinct Car objects using valid constructor calls with appropriate arguments (e.g. Car car1 = new Car(10.0, "Red");).',
            apRules: 'Requires correct new keyword, class name, and argument types matching constructor.'
          },
          {
            id: 'P3',
            section: 'CarRunner',
            pointTitle: 'Point 3: Initial info printed for both cars',
            description: 'Prints initial information for both Car objects using System.out.println(car1) or explicit toString call before modifications.',
            apRules: 'Must print both objects before state changes occur.'
          },
          {
            id: 'P4',
            section: 'CarRunner',
            pointTitle: 'Point 4: addGas() correctly called on 1st car',
            description: 'Calls addGas(12.5) on the first car object passing 12.5 as double parameter.',
            apRules: 'Must be called specifically on the first car instance.'
          },
          {
            id: 'P5',
            section: 'CarRunner',
            pointTitle: 'Point 5: changeColor() correctly called on 2nd car',
            description: 'Calls changeColor("Silver") on the second car object with String parameter "Silver".',
            apRules: 'Must be called specifically on the second car instance.'
          },
          {
            id: 'P6',
            section: 'CarRunner',
            pointTitle: 'Point 6: Final info printed for both cars',
            description: 'Prints final information for both Car objects after state modifications have taken place.',
            apRules: 'Must print state of both cars after addGas and changeColor calls.'
          }
        ],
        samplePerfect: `// --- PERFECT CAR & CARRUNNER CODE ---
// In Car.java:
public void addGas(double amount) {
    gasLevel += amount;
}

// In CarRunner.java:
public static void main(String[] args) {
    // 1. Create two Car objects
    Car car1 = new Car(15.0, "Blue");
    Car car2 = new Car(8.0, "Red");
    
    // 2. Print initial info
    System.out.println(car1);
    System.out.println(car2);
    
    // 3. Add 12.5 gallons to first car
    car1.addGas(12.5);
    
    // 4. Change color of second car to "Silver"
    car2.changeColor("Silver");
    
    // 5. Print final info
    System.out.println(car1);
    System.out.println(car2);
}`,
        sampleMistakes: `// --- COMMON MISTAKES RESPONSE (Expected 3/6) ---
// Car class error: Overwrites gas level instead of adding
public void addGas(double amount) {
    gasLevel = amount; // Error: Forgot +=
}

// CarRunner class
public static void main(String[] args) {
    Car c1 = new Car(10.0, "Black"); // Error: Only created 1 car object
    
    System.out.println(c1);
    
    c1.addGas(12.5);
    // Error: Missed changeColor call on second car because second car wasn't created!
    
    System.out.println(c1);
}`
      }
    ];

    // --- APP COMPONENT ---
    function App() {
      // Active state
      const [currentPresetId, setCurrentPresetId] = useState(PRESET_RUBRICS[0].id);
      const [studentName, setStudentName] = useState('Alex Rivera');
      const [studentCode, setStudentCode] = useState(PRESET_RUBRICS[0].samplePerfect);
      const [apiKey, setApiKey] = useState('');
      const [showApiKeyModal, setShowApiKeyModal] = useState(false);
      
      // Evaluation result state
      const [isGrading, setIsGrading] = useState(false);
      const [gradingError, setGradingError] = useState(null);
      const [evaluationResult, setEvaluationResult] = useState(null);
      
      // History of current session
      const [history, setHistory] = useState([]);
      const [activeTab, setActiveTab] = useState('grader'); // 'grader' | 'rubric' | 'history' | 'custom'

      // Custom assignment builder
      const [customRubric, setCustomRubric] = useState({
        id: 'custom-' + Date.now(),
        name: 'Custom AP CSA Assignment',
        source: 'Teacher Created',
        totalPoints: 3,
        description: 'Enter your custom problem description.',
        promptText: 'Describe prompt here...',
        criteria: [
          { id: 'C1', section: 'Section 1', pointTitle: 'Point 1: Correct Syntax', description: 'Code compiles and follows standard Java syntax.', apRules: 'No credit for syntax errors.' },
          { id: 'C2', section: 'Section 1', pointTitle: 'Point 2: Correct Logic', description: 'Performs requested logic accurately.', apRules: '' },
          { id: 'C3', section: 'Section 1', pointTitle: 'Point 3: Returns Correct Value', description: 'Returns expected output for test cases.', apRules: '' }
        ],
        samplePerfect: '// Paste sample code here',
        sampleMistakes: '// Paste mistake sample here'
      });

      // Get current active rubric definition
      const activeRubric = currentPresetId === customRubric.id 
        ? customRubric 
        : PRESET_RUBRICS.find(r => r.id === currentPresetId) || PRESET_RUBRICS[0];

      // Update student code sample when changing preset
      const handleSelectPreset = (id) => {
        setCurrentPresetId(id);
        const selected = id === customRubric.id ? customRubric : PRESET_RUBRICS.find(r => r.id === id);
        if (selected) {
          setStudentCode(selected.samplePerfect);
          setEvaluationResult(null);
        }
      };

      // Auto-Fill sample code helpers
      const loadSample = (type) => {
        if (type === 'perfect') {
          setStudentCode(activeRubric.samplePerfect);
        } else if (type === 'mistakes') {
          setStudentCode(activeRubric.sampleMistakes);
        } else {
          setStudentCode('');
        }
        setEvaluationResult(null);
      };

      // API Grading call with exponential backoff
      const gradeStudentCode = async () => {
        if (!studentCode.trim()) {
          alert('Please paste or enter student Java code first.');
          return;
        }

        setIsGrading(true);
        setGradingError(null);

        // System Instruction enforcing strict AP CSA Grading Rules
        const systemPrompt = `You are a master AP Computer Science A exam grader and computer science educator.
Your job is to strictly evaluate student Java code against the specified rubric points.

CRITICAL AP CSA SCORING PRINCIPLES TO FOLLOW:
1. Evaluate each rubric point independently as Earned (true - 1 point) or Missed (false - 0 points).
2. Follow official AP CSA lenient rules explicitly noted in the rubric (e.g., if AP rules state "Responses can still earn the point even if they omit the underscore", DO NOT deduct points for omitting underscore).
3. Carry-Through Errors: Do not penalize a student twice for an earlier mistake unless the subsequent code call is invalid. If an earlier variable was named slightly differently or calculated wrong, but used logically correctly in a later step, earn the point for the later step.
4. For every point, provide:
   - "earned": true/false
   - "explanation": Concise, clear AP-oriented explanation of why point was awarded or missed.
   - "evidenceCodeSnippet": Exact line(s) from student code corresponding to this evaluation.
   - "suggestion": Constructive fix advice for student if missed, or standard confirmation if earned.
5. Provide a global "overallFeedback" summary (2-3 sentences) encouraging the student and highlighting key concepts to review.`;

        const userQuery = `Rubric Context:
Assignment Name: ${activeRubric.name}
Problem Prompt:
${activeRubric.promptText}

Rubric Points Criteria to Evaluate:
${activeRubric.criteria.map(c => `[Point ID: ${c.id}] Title: ${c.pointTitle} | Description: ${c.description} | AP Lenient Rules: ${c.apRules}`).join('\n')}

Student Submission Code:
\`\`\`java
${studentCode}
\`\`\`

Evaluate each point according to AP CSA standards. Respond ONLY in valid JSON matching the schema.`;

        const payload = {
          contents: [{ parts: [{ text: userQuery }] }],
          systemInstruction: { parts: [{ text: systemPrompt }] },
          generationConfig: {
            responseMimeType: "application/json",
            responseSchema: {
              type: "OBJECT",
              properties: {
                overallFeedback: { type: "STRING" },
                pointResults: {
                  type: "ARRAY",
                  items: {
                    type: "OBJECT",
                    properties: {
                      pointId: { type: "STRING" },
                      earned: { type: "BOOLEAN" },
                      explanation: { type: "STRING" },
                      evidenceCodeSnippet: { type: "STRING" },
                      suggestion: { type: "STRING" }
                    },
                    propertyOrdering: ["pointId", "earned", "explanation", "evidenceCodeSnippet", "suggestion"]
                  }
                }
              },
              propertyOrdering: ["overallFeedback", "pointResults"]
            }
          }
        };

        const keyToUse = apiKey.trim();
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${keyToUse}`;

        // Fetch with exponential backoff retry
        let attempts = 0;
        let maxAttempts = 3;
        let delay = 1000;
        let success = false;
        let resultJson = null;

        while (attempts < maxAttempts && !success) {
          try {
            const res = await fetch(apiUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            if (!res.ok) {
              const errData = await res.json().catch(() => ({}));
              throw new Error(errData.error?.message || `Server responded with status ${res.status}`);
            }

            const data = await res.json();
            const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (rawText) {
              resultJson = JSON.parse(rawText);
              success = true;
            } else {
              throw new Error('Empty response payload from AI Engine.');
            }
          } catch (err) {
            attempts++;
            if (attempts >= maxAttempts) {
              // Fallback offline evaluation algorithm if network or key issue occurs
              console.warn('API call failed after retries, falling back to heuristic engine:', err);
              resultJson = runHeuristicEvaluation(activeRubric, studentCode);
              success = true;
            } else {
              await new Promise(r => setTimeout(r, delay));
              delay *= 2;
            }
          }
        }

        if (resultJson) {
          // Merge point details with original criteria metadata
          const formattedPoints = activeRubric.criteria.map(crit => {
            const evaluated = resultJson.pointResults?.find(p => p.pointId === crit.id);
            return {
              ...crit,
              earned: evaluated ? Boolean(evaluated.earned) : true,
              explanation: evaluated?.explanation || 'Evaluated per rubric guidelines.',
              evidenceCodeSnippet: evaluated?.evidenceCodeSnippet || '',
              suggestion: evaluated?.suggestion || ''
            };
          });

          const earnedCount = formattedPoints.filter(p => p.earned).length;
          const totalPoints = activeRubric.criteria.length;
          const percentage = Math.round((earnedCount / totalPoints) * 100);

          const finalEval = {
            id: 'eval-' + Date.now(),
            studentName: studentName.trim() || 'Anonymous Student',
            rubricName: activeRubric.name,
            timestamp: new Date().toLocaleString(),
            score: earnedCount,
            totalPoints: totalPoints,
            percentage: percentage,
            overallFeedback: resultJson.overallFeedback || `Student earned ${earnedCount} out of ${totalPoints} points (${percentage}%).`,
            points: formattedPoints,
            studentCode: studentCode
          };

          setEvaluationResult(finalEval);
          setHistory(prev => [finalEval, ...prev]);
        }

        setIsGrading(false);
      };

      // Fallback offline rule engine if API fails
      const runHeuristicEvaluation = (rubric, code) => {
        const lowerCode = code.toLowerCase();
        const pointResults = rubric.criteria.map(crit => {
          let earned = false;
          let explanation = '';
          let snippet = '';

          if (crit.id === 'A1') {
            earned = lowerCode.includes('indexof(".")') || lowerCode.includes("indexof('.')") || lowerCode.includes('indexof("@")');
            explanation = earned ? 'Found indexOf calls for "." and/or "@".' : 'Missing correct String.indexOf(".") or indexOf("@") call.';
          } else if (crit.id === 'B1') {
            earned = lowerCode.includes('substring') && (lowerCode.includes('first') || lowerCode.includes('last'));
            explanation = earned ? 'Used substring to extract names.' : 'Missing substring extraction for first and last name.';
          } else if (crit.id === 'B2' || crit.id === 'C2' || crit.id === 'E2') {
            earned = lowerCode.includes('+');
            explanation = earned ? 'Combined string variables using concatenation operator.' : 'Missing string concatenation for username.';
          } else if (crit.id === 'D1' || crit.id === 'D2') {
            earned = lowerCode.includes('math.random()');
            explanation = earned ? 'Utilized Math.random() method.' : 'Missing call to Math.random().';
          } else {
            earned = code.trim().length > 30;
            explanation = earned ? 'Criteria met based on code structure.' : 'Insufficient code logic detected for this rubric requirement.';
          }

          return {
            pointId: crit.id,
            earned: earned,
            explanation: explanation,
            evidenceCodeSnippet: code.split('\n')[0] || '',
            suggestion: earned ? 'Great job!' : 'Review AP CSA specification for this method call.'
          };
        });

        return {
          overallFeedback: 'Auto-evaluation completed using standard syntax checks.',
          pointResults: pointResults
        };
      };

      // Teacher Override Toggle
      const togglePointEarned = (pointId) => {
        if (!evaluationResult) return;
        const updatedPoints = evaluationResult.points.map(p => {
          if (p.id === pointId) {
            return { ...p, earned: !p.earned };
          }
          return p;
        });

        const earnedCount = updatedPoints.filter(p => p.earned).length;
        const totalPoints = updatedPoints.length;
        const percentage = Math.round((earnedCount / totalPoints) * 100);

        setEvaluationResult({
          ...evaluationResult,
          score: earnedCount,
          percentage: percentage,
          points: updatedPoints
        });
      };

      // Teacher Edit Rationale
      const updatePointExplanation = (pointId, newExplanation) => {
        if (!evaluationResult) return;
        const updatedPoints = evaluationResult.points.map(p => {
          if (p.id === pointId) {
            return { ...p, explanation: newExplanation };
          }
          return p;
        });
        setEvaluationResult({ ...evaluationResult, points: updatedPoints });
      };

      // Copy LMS Summary
      const copyLmsSummary = () => {
        if (!evaluationResult) return;
        const missedList = evaluationResult.points
          .filter(p => !p.earned)
          .map(p => `- ${p.pointTitle}: ${p.explanation}`)
          .join('\n');

        const summaryText = `AP CSA Grade Summary: ${evaluationResult.studentName}
Assignment: ${evaluationResult.rubricName}
Score: ${evaluationResult.score} / ${evaluationResult.totalPoints} (${evaluationResult.percentage}%)

Feedback Summary:
${evaluationResult.overallFeedback}

${missedList ? `Points Missed Breakdown:\n${missedList}` : 'All rubric criteria earned! Excellent work.'}`;

        navigator.clipboard ? navigator.clipboard.writeText(summaryText) : document.execCommand('copy');
        alert('LMS Grade Summary copied to clipboard!');
      };

      // Export / Print Report
      const handlePrintReport = () => {
        window.print();
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-950 text-slate-100">
          
          {/* TOP HEADER NAVIGATION */}
          <header className="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-30 px-4 py-3 flex flex-wrap items-center justify-between gap-4">
            <div className="flex items-center space-x-3">
              <div className="bg-gradient-to-tr from-blue-600 to-indigo-500 text-white p-2 rounded-xl shadow-lg shadow-blue-500/20 font-bold text-lg flex items-center justify-center w-10 h-10">
                AP
              </div>
              <div>
                <h1 className="font-bold text-lg tracking-tight text-white flex items-center gap-2">
                  AP CSA FRQ Auto-Grader
                  <span className="bg-blue-500/10 text-blue-400 border border-blue-500/20 text-xs px-2 py-0.5 rounded-full font-medium">2026 Edition</span>
                </h1>
                <p className="text-xs text-slate-400">College Board Rubric Evaluator & Teacher Assistant</p>
              </div>
            </div>

            {/* TAB CONTROLS & ASSIGNMENT SELECTOR */}
            <div className="flex items-center space-x-2 bg-slate-950 p-1 rounded-xl border border-slate-800">
              <button
                onClick={() => setActiveTab('grader')}
                className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${activeTab === 'grader' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}
              >
                Auto-Grader
              </button>
              <button
                onClick={() => setActiveTab('rubric')}
                className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${activeTab === 'rubric' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}
              >
                Rubric Specs
              </button>
              <button
                onClick={() => setActiveTab('history')}

                            onClick={() => {
                              const updated = customRubric.criteria.filter((_, i) => i !== index);
                              setCustomRubric({ ...customRubric, criteria: updated, totalPoints: updated.length });
                            }}
                            className="text-rose-400 hover:text-rose-300 text-xs"
                          >
                            Remove
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>

                  <button
                    onClick={() => {
                      setCurrentPresetId(customRubric.id);
                      setActiveTab('grader');
                    }}
                    className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-6 py-2.5 rounded-xl text-sm transition"
                  >
                    Save & Activate Custom Rubric
                  </button>
                </div>
              </div>
            )}

          </main>

          {/* API KEY CONFIGURATION MODAL */}
          {showApiKeyModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-lg text-white">Gemini API Key Setup</h3>
                  <button onClick={() => setShowApiKeyModal(false)} className="text-slate-400 hover:text-white text-sm">✕</button>
                </div>
                
                <p className="text-xs text-slate-300 leading-relaxed">
                  Enter your Google Gemini API key below. If left blank, the environment runtime key will be used automatically.
                </p>

                <div>
                  <label className="block text-xs font-semibold text-slate-400 mb-1">API Key</label>
                  <input
                    type="password"
                    value={apiKey}
                    onChange={(e) => setApiKey(e.target.value)}
                    placeholder="AIzaSy..."
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"
                  />
                </div>

                <div className="flex justify-end space-x-2 pt-2">
                  <button
                    onClick={() => setShowApiKeyModal(false)}
                    className="bg-blue-600 hover:bg-blue-500 text-white font-bold px-5 py-2 rounded-xl text-xs transition"
                  >
                    Save Key
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render App into DOM
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
